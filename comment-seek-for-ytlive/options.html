<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>コメントシーク for YouTube Live 設定</title>
  <style>
    body {
      font-family: "Segoe UI", "Meiryo", sans-serif;
      font-size: 14px;
      color: #202124;
      background: #ffffff;
      margin: 0;
      padding: 16px 20px;
      min-width: 320px;
    }
    h1 {
      font-size: 16px;
      margin: 0 0 12px;
    }
    .row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
    }
    label {
      display: block;
    }
    input[type="number"] {
      width: 70px;
      padding: 4px 6px;
      font-size: 14px;
      box-sizing: border-box;
    }
    .desc {
      color: #5f6368;
      font-size: 12px;
      margin: 4px 0 16px;
      line-height: 1.5;
    }
    button {
      padding: 6px 16px;
      font-size: 14px;
      cursor: pointer;
    }
    #status {
      margin-left: 10px;
      color: #188038;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <h1>コメントシーク for YouTube Live</h1>

  <div class="row">
    <label for="seekOffsetSec">コメント時刻の何秒前へ飛ぶか：</label>
    <input type="number" id="seekOffsetSec" min="0" max="60" step="1" value="5">
    <span>秒</span>
  </div>
  <p class="desc">
    ジャンプボタンを押したとき、コメントが投稿された時刻より
    ここで指定した秒数だけ手前へ再生位置を移動します（0〜60秒）。
  </p>

  <div class="row">
    <button id="save" type="button">保存</button>
    <span id="status"></span>
  </div>

  <script src="options.js"></script>
</body>
</html>
