<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>広告カーテン for OBS - 設定</title>
  <style>
    :root {
      --bg: #1e2128;
      --panel: #262b34;
      --text: #e6e8ec;
      --muted: #9aa2ad;
      --accent: #4c8faf;
      --ok: #4caf7d;
      --bad: #d05050;
      --border: #363c47;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 24px;
      background: var(--bg); color: var(--text);
      font-family: "Segoe UI", "Meiryo", sans-serif; font-size: 13px;
    }
    .container { max-width: 560px; margin: 0 auto; }
    h1 { font-size: 18px; margin: 0 0 16px; }
    h2 { font-size: 14px; margin: 20px 0 8px; color: var(--muted); }
    .panel {
      background: var(--panel); border: 1px solid var(--border);
      border-radius: 8px; padding: 16px;
    }
    .field { margin-bottom: 14px; }
    .field:last-child { margin-bottom: 0; }
    label.name { display: block; font-weight: 600; margin-bottom: 4px; }
    .desc { color: var(--muted); font-size: 11px; line-height: 1.5; margin-top: 4px; }
    input[type="text"], input[type="password"], input[type="number"] {
      width: 100%; padding: 7px 10px;
      background: var(--bg); color: var(--text);
      border: 1px solid var(--border); border-radius: 6px;
      font-size: 13px; font-family: inherit;
    }
    input:focus { outline: 1px solid var(--accent); }
    .inline { display: flex; gap: 12px; }
    .inline .field { flex: 1; }
    .check { display: flex; align-items: flex-start; gap: 8px; cursor: pointer; }
    .check input { margin-top: 2px; accent-color: var(--ok); }
    .buttons { display: flex; gap: 12px; margin-top: 18px; }
    button {
      flex: 1; padding: 9px 0; border: none; border-radius: 6px;
      font-size: 13px; font-weight: 600; cursor: pointer; font-family: inherit;
      background: var(--accent); color: #fff;
    }
    button.secondary { background: #4a4f59; }
    button:hover { filter: brightness(1.1); }
    #result { margin-top: 12px; font-size: 12px; line-height: 1.5; min-height: 18px; white-space: pre-line; }
    #result.ok { color: var(--ok); }
    #result.bad { color: var(--bad); }
  </style>
</head>
<body>
  <div class="container">
    <h1>広告カーテン for OBS - 設定</h1>

    <h2>OBS WebSocket 接続</h2>
    <div class="panel">
      <div class="inline">
        <div class="field">
          <label class="name" for="host">ホスト</label>
          <input type="text" id="host" placeholder="127.0.0.1">
        </div>
        <div class="field">
          <label class="name" for="port">ポート</label>
          <input type="number" id="port" min="1" max="65535" placeholder="4455">
        </div>
      </div>
      <div class="field">
        <label class="name" for="password">パスワード</label>
        <input type="password" id="password" autocomplete="off">
        <p class="desc">OBSの「ツール → WebSocketサーバー設定」で表示されるパスワード。この端末にのみ保存されます。</p>
      </div>
    </div>

    <h2>カーテン動作</h2>
    <div class="panel">
      <div class="field">
        <label class="name" for="sourceName">OBSソース名(カンマ区切りで複数可)</label>
        <input type="text" id="sourceName" placeholder="例: YouTube同時視聴, YouTube音声">
        <p class="desc">
          OBSでYouTubeを映しているソース名(ウィンドウキャプチャ等)。
          音声を別ソース(アプリケーション音声キャプチャ等)で取っている場合は
          「映像用, 音声用」のようにカンマ区切りで両方指定してください。
          グループ内のソースは指定できません。その場合はグループ名を指定してください。
        </p>
      </div>
      <div class="field">
        <label class="name" for="restoreDelayMs">復帰ディレイ(ミリ秒)</label>
        <input type="number" id="restoreDelayMs" min="0" max="5000" step="100">
        <p class="desc">広告終了からソースを再表示するまでの待ち時間。広告の残像が一瞬映るのを防ぎます。既定300。</p>
      </div>
      <div class="field">
        <label class="check">
          <input type="checkbox" id="hideAfterEnded">
          <span>動画が最後まで再生されたらカーテンを閉じ、次の動画の再生開始で開く<br>
          <span class="desc">同時視聴で次の動画を探す間の画面操作を配信に載せません。</span></span>
        </label>
      </div>
      <div class="field">
        <label class="check">
          <input type="checkbox" id="failSafe">
          <span>フェイルセーフ: 広告検知が機能不能になったら隠す側に倒す<br>
          <span class="desc">YouTubeの仕様変更等で検知できなくなった場合、誤って広告が配信に載るのを防ぐため、ソースを隠します。</span></span>
        </label>
      </div>
    </div>

    <div class="buttons">
      <button id="save">保存</button>
      <button id="test" class="secondary">接続テスト</button>
    </div>
    <div id="result"></div>
  </div>

  <script src="options.js"></script>
</body>
</html>
